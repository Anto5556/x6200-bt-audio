# BT Audio -- settings for the Xiegu X6200.  KEY=VALUE, '#' starts a comment.
#
# Front-panel buttons
# -------------------
# The keypad is a 5x6 matrix whose keymap (in the device tree) assigns vendor
# keycodes 704-733 (0x2C0-0x2DD).  You never have to type one in by hand: run
#
#     /usr/share/support/btaudio keymap
#
# and the screen asks for one button per navigation role, recording whatever the
# backend sees as you press it ("keywatch:" and "keymap:" lines land in
# /tmp/btaudio.log).  Leave a value empty to disable that binding; a backend
# restart reloads the file.
#
# The button that opens the BT Audio screen.  It must be pressed "launch_presses"
# times in quick succession (within 2 s) so a single accidental press cannot
# steal the screen from whatever that button normally does.  While the screen is
# up, the same button closes it again after "exit_presses" quick presses.
#
# The two counts are independent, so the one button both raises and dismisses
# the screen.  Set both to 1 for a plain toggle (one press in, one press out).
#
# You never have to edit this line by hand to move the button: the screen's own
# REMAP entry (next to SCAN) asks for the open/close button, then the scroll
# knob, then the select button, and writes each one here as it is answered.
#
# The values below are the bindings this radio is used with, and they are also
# the built-in defaults (see DEFAULT_KEYS in btaudiod), so the panel stays
# navigable even if this file is missing or has lost its bindings.  Any value
# set here wins over the built-in default; an empty value disables that binding.
launch=724
launch_presses=2
exit_presses=3

# Navigation while the BT Audio screen is open (filled in by `btaudio keymap`).
#
# A knob plus one select button covers the whole screen: the knob walks the
# amber ring through the route switch, the volume, the speaker, SCAN and every
# device row, and a press acts on whatever it is on.  Selecting the volume hands
# the knob over to it -- turn to adjust, select again to let go.
up=
down=
select=730
back=714

# Scroll knob
# -----------
# `btaudio keymap` learns this in its second phase: turn the knob and the evdev
# device it arrives on is written here.  The radio exposes its encoders as
# rotary@0..3, one REL axis each, and they are only ever read -- the stock GUI
# keeps its knobs whenever the BT Audio screen is not up.  scroll_invert turns a
# knob that feels backwards around; scroll_step is how many raw units make one
# step for encoders that report two per detent.
scroll_device=/dev/input/event4
scroll_invert=1
scroll_step=1

# Screen orientation
# ------------------
# "auto" is right for this panel: the screen turns its 800x480 layout to suit the
# frame Qt hands it -- 270 for the panel's own 480x800 frame, which is the angle
# this radio needs (see the launcher for why the layout, not EGLFS, does the
# turning).  Run /usr/share/support/btaudio calibrate only if the screen ever
# comes up sideways: it opens showing the angle in use, turns the layout a quarter
# turn at a time until TOP is at the top of the radio, and then saves it here.
rotation=auto
